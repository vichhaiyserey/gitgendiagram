[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "secdiagram"
version = "0.3.0"
description = "Deterministic architecture, relationship, and security diagrams for Python repositories."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "secdiagram maintainers" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Security",
]

[project.scripts]
secdiagram = "secdiagram_core.cli:main"
secdiagram-image = "secdiagram_core.render_image:main"
secdiagram-server = "secdiagram_core.cli:server_main"

[project.optional-dependencies]
dev = [
    "bandit[toml]==1.9.4",
    "build==1.6.1",
    "coverage[toml]==7.16.0; python_version < '3.11'",
    "coverage[toml]==7.17.1; python_version >= '3.11'",
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "ruff==0.17.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["secdiagram_core*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"secdiagram_core/__init__.py" = ["E402"]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["secdiagram_core", "scripts"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["secdiagram_core"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
