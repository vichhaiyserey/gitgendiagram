name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PIP_VERSION: "26.3"

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install "pip==${PIP_VERSION}"
          python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Enforce coverage threshold
        run: python -m coverage report --format=markdown | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Generate coverage XML
        if: matrix.python-version == '3.12'
        run: python -m coverage xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  quality:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install "pip==${PIP_VERSION}"
          python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Mypy type check
        run: mypy
      - name: Task tooling tests
        run: python -m unittest tests.test_taskctl -v
      - name: Task cache validation
        run: python scripts/taskctl.py validate --offline

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install "pip==${PIP_VERSION}"
          python -m pip install -e ".[dev]"
      - name: Bandit high-severity gate
        run: python -m bandit -r secdiagram_core -lll -f txt
      - name: Bandit full report
        if: always()
        continue-on-error: true
        run: python -m bandit -r secdiagram_core -f json -o bandit.json
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bandit-report
          path: bandit.json
          if-no-files-found: ignore
      - name: Dependency vulnerability audit (pip-audit)
        run: |
          python -m pip freeze --exclude-editable > "${RUNNER_TEMP}/audit-requirements.txt"
          python -m pip_audit --strict --progress-spinner off -r "${RUNNER_TEMP}/audit-requirements.txt"
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-fs.sarif
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: tests/fixtures,.git,.venv
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-fs.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy
        continue-on-error: true

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
