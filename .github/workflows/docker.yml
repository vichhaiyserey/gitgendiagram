name: Docker

on:
  push:
    branches: [main, develop]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "secdiagram_core/**"
      - "tests/**"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "secdiagram_core/**"
      - "tests/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build image & scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: secdiagram:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test CLI
        run: docker run --rm secdiagram:ci --help
      - name: Verify containerized diagram generation
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" secdiagram:ci --dir /repo/tests/fixtures/sample_app --out /tmp/verify-out --format mermaid --image png --no-security
      # Report-only: the bundled Node.js/Mermaid CLI layer can carry upstream
      # base-image CVEs that cannot be fixed from this repository.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: secdiagram:ci
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          format: sarif
          limit-severities-for-sarif: true
          output: trivy-image.sarif
          exit-code: "0"
          ignore-unfixed: true
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-image.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
        continue-on-error: true
