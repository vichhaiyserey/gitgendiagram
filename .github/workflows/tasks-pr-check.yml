name: Task governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [develop, main]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  linked-issue:
    name: Linked issue and labels
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]' &&
      !(github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop')
    runs-on: ubuntu-latest
    steps:
      - name: Verify linked issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          body_file="${RUNNER_TEMP}/pr-body.txt"
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$body_file"
          refs=$(grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?)[: ]+#[0-9]+' "$body_file" | grep -Eo '[0-9]+' | sort -un || true)
          if [ -z "$refs" ]; then
            refs=$(printf '%s' "$PR_BRANCH" | grep -Eo '[0-9]+$' || true)
          fi
          if [ -z "$refs" ]; then
            echo "::error::Link a task issue in the PR body (for example 'Closes #12') or end the branch name with the issue number."
            exit 1
          fi
          failed=0
          while IFS= read -r number; do
            [ -n "$number" ] || continue
            data=$(gh issue view "$number" --json state,labels,title,url)
            state=$(printf '%s' "$data" | jq -r '.state')
            title=$(printf '%s' "$data" | jq -r '.title')
            url=$(printf '%s' "$data" | jq -r '.url')
            labels=$(printf '%s' "$data" | jq -r '.labels[].name' | tr '\n' ' ')
            if [ "$state" != "OPEN" ]; then
              echo "::error::Issue #$number is $state; reopen it or link an open issue."
              failed=1
            fi
            if ! printf '%s' "$labels" | grep -Eq '(^| )type:'; then
              echo "::warning::Issue #$number is missing a type:* label."
            fi
            if ! printf '%s' "$labels" | grep -Eq '(^| )priority:'; then
              echo "::warning::Issue #$number is missing a priority:* label."
            fi
            echo "- #$number $title ($url)" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$refs"
          exit "$failed"
