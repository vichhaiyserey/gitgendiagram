name: Task project sync

on:
  issues:
    types: [opened, reopened, closed, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: task-project-sync-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync issue to project board
    runs-on: ubuntu-latest
    env:
      HAS_PROJECT_TOKEN: ${{ secrets.TASKS_PROJECT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Sync issue to project
        if: env.HAS_PROJECT_TOKEN == 'true' && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.TASKS_PROJECT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          status=""
          case "$EVENT_ACTION" in
            opened|reopened) status="Backlog" ;;
            closed) status="Done" ;;
            edited) status="" ;;
          esac
          if [ -n "$status" ]; then
            python scripts/taskctl.py project-sync "$ISSUE_NUMBER" --status "$status"
          else
            python scripts/taskctl.py project-sync "$ISSUE_NUMBER"
          fi
      - name: Warn when project token is missing
        if: env.HAS_PROJECT_TOKEN != 'true'
        run: echo "::warning::TASKS_PROJECT_TOKEN is not configured; the Projects v2 board was not updated."
