name: Engineering task
description: Track refactors, tests, CI, documentation, or security work.
title: "[Task]: "
labels: ["type:refactor"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What needs to happen and why?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      value: |
        In scope:
        - ...

        Out of scope:
        - ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] ...
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Task type
      options:
        - refactor
        - test
        - ci
        - docs
        - security
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - discovery
        - ast
        - graph
        - security
        - render
        - iac
        - cli
        - docs
        - ci
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
      default: 2
    validations:
      required: true
