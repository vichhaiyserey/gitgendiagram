name: Bug report
description: Report a defect or regression.
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide a minimal reproduction. Security vulnerabilities must be reported privately via the repository security advisory, not in a public issue.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, install method, and relevant command output.
      value: |
        - OS:
        - Python:
        - secdiagram version/commit:
        - Command:
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - discovery
        - ast
        - graph
        - security
        - render
        - iac
        - cli
        - docs
        - ci
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
      default: 1
    validations:
      required: true
